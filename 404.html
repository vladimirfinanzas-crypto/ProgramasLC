<style>

.arm{animation:arm 6s ease-in-out infinite}@keyframes arm{0%,40%{transform:rotate(0)}55%,85%{transform:rotate(-72deg)}100%{transform:rotate(0)}}

@media(max-width:520px){.tl{grid-template-columns:1fr}}
